[project]
name = "book-companion-tool"
version = "0.1.0"
description = "Rag Based Book Companion Tool"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.6",
    "openai>=1.51.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-text-splitters>=0.3.0",
    "faiss-cpu>=1.8.0",
    "pypdf>=4.0.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.9.0",
    "python-multipart>=0.0.12",
    "click>=8.3.1",
    "rich>=14.3.3",
    "pydantic-settings>=2.13.1",
    "langchain-community>=0.4.1",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
